
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog Application</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h2>MyBlog</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Welcome to My Blog</h1>
        <p>Read, Write and Share Your Stories</p>
        <a href="login.html" class="btn">Get Started</a>
    </section>

    <section class="blogs">
        <h2>Latest Blogs</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="Search blogs by title or content..."
            style="width: 100%; padding: 12px; margin: 15px 0; box-sizing: border-box;"
        >

        <select id="categoryFilter"
            style="width: 100%; padding: 12px; margin-bottom: 15px;">
            <option value="All">All Categories</option>
            <option value="Technology">Technology</option>
            <option value="Education">Education</option>
            <option value="Programming">Programming</option>
            <option value="Cyber Security">Cyber Security</option>
            <option value="Lifestyle">Lifestyle</option>
            <option value="Travel">Travel</option>
            <option value="Health">Health</option>
            <option value="General">General</option>
        </select>

        <div class="blog-container" id="blog-container">
            <p>Loading blogs...</p>
        </div>
    </section>

    <footer>
        <p>© 2026 MyBlog. All Rights Reserved.</p>
    </footer>

    <script>
        let allBlogs = [];

        async function loadBlogs() {
            const container = document.getElementById('blog-container');

            try {
                const response = await fetch('http://localhost:3000/api/blogs');

                if (!response.ok) {
                    throw new Error('Unable to load blogs');
                }

                allBlogs = await response.json();
                filterBlogs();

            } catch (error) {
                container.textContent =
                    'Unable to load blogs. Please check the backend server.';
                console.error(error);
            }
        }

        function displayBlogs(blogs) {
            const container = document.getElementById('blog-container');
            container.innerHTML = '';

            if (blogs.length === 0) {
                container.textContent = 'No blogs found.';
                return;
            }

            blogs.forEach(blog => {
                const card = document.createElement('div');
                card.className = 'blog-card';

                const title = document.createElement('h3');
                title.textContent = blog.title;

                const category = document.createElement('p');
                category.textContent = 'Category: ' + (blog.category || 'General');

                const content = document.createElement('p');
                content.textContent = blog.content;

                const link = document.createElement('a');
                link.href = `blog-details.html?id=${blog.id}`;
                link.textContent = 'Read More';

                card.appendChild(title);
                card.appendChild(category);
                card.appendChild(content);
                card.appendChild(link);

                container.appendChild(card);
            });
        }

        function filterBlogs() {
            const searchText = document.getElementById('searchInput')
                .value.toLowerCase().trim();

            const selectedCategory = document.getElementById('categoryFilter')
                .value;

            const filteredBlogs = allBlogs.filter(blog => {
                const matchesSearch =
                    blog.title.toLowerCase().includes(searchText) ||
                    blog.content.toLowerCase().includes(searchText);

                const matchesCategory =
                    selectedCategory === 'All' ||
                    (blog.category || 'General') === selectedCategory;

                return matchesSearch && matchesCategory;
            });

            displayBlogs(filteredBlogs);
        }

        document.getElementById('searchInput')
            .addEventListener('input', filterBlogs);

        document.getElementById('categoryFilter')
            .addEventListener('change', filterBlogs);

        loadBlogs();
    </script>

    <script src="js/script.js"></script>
</body>
</html>
