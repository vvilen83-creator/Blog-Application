
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="create-blog-page">

    <header class="auth-header">
        <h2>MyBlog</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <main class="create-blog-container">
        <div class="create-blog-box">

            <div class="create-blog-icon">✍️</div>

            <span class="create-blog-tag">SHARE YOUR IDEAS</span>

            <h1>Create New Blog</h1>

            <p class="create-blog-subtitle">
                Your thoughts deserve to be shared with the world!
            </p>

            <form id="blogForm">

                <label for="blogTitle">Blog Title</label>
                <input
                    type="text"
                    id="blogTitle"
                    placeholder="Enter your blog title..."
                    required
                >

                <label for="blogCategory">Choose Category</label>
                <select id="blogCategory" required>
                    <option value="">Select Blog Category</option>
                    <option value="Technology">Technology</option>
                    <option value="Education">Education</option>
                    <option value="Programming">Programming</option>
                    <option value="Cyber Security">Cyber Security</option>
                    <option value="Lifestyle">Lifestyle</option>
                    <option value="Travel">Travel</option>
                    <option value="Health">Health</option>
                    <option value="General">General</option>
                </select>

                <label for="blogContent">Blog Content</label>
                <textarea
                    id="blogContent"
                    placeholder="Start writing your thoughts here..."
                    rows="8"
                    required
                ></textarea>

                <button type="submit" class="publish-blog-btn">
                    Publish Blog ✨
                </button>

            </form>

            <p class="create-blog-note">
                ✦ Every great story starts with an idea.
            </p>

        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
