
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h2>MyBlog Dashboard</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="create-blog.html">Create Blog</a>
            <a href="login.html">Logout</a>
        </nav>
    </header>

    <section class="dashboard">
        <h1>Welcome to Dashboard!</h1>
        <p>Manage your blog posts here.</p>

        <a href="create-blog.html" class="btn">
            + Create New Blog
        </a>

        <h2>My Blog Posts</h2>

        <div class="blog-container">

            <div class="blog-card">
                <h3>My First Blog</h3>
                <p>This is my first blog post.</p>
                <button>Edit</button>
                <button>Delete</button>
            </div>

            <div class="blog-card">
                <h3>Technology Blog</h3>
                <p>Technology is changing our world.</p>
                <button>Edit</button>
                <button>Delete</button>
            </div>

        </div>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
