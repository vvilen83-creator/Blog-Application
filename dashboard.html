
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h2>MyBlog Dashboard</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="create-blog.html">Create Blog</a>
            <a href="profile.html">Profile</a>
            <a href="#" id="logoutBtn">Logout</a>
        </nav>
    </header>

    <section class="dashboard">
        <h1>Welcome to Dashboard!</h1>
        <p>Manage your blog posts here.</p>

        <div class="profile-section">
            <h2>My Profile</h2>
            <p><strong>Email:</strong> <span id="userEmail">Loading...</span></p>
            <p><strong>User ID:</strong> <span id="userId">Loading...</span></p>
            <a href="profile.html">View Full Profile</a>
        </div>

        <a href="create-blog.html" class="btn">
            + Create New Blog
        </a>

        <h2>My Blog Posts</h2>

        <div class="blog-container" id="blogContainer">
            <p id="loadingMessage">Loading your blogs...</p>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
