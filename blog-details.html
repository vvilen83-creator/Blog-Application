
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Details - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h2>MyBlog</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <section class="blogs">
        <div class="blog-container" id="blog-details">
            <p>Loading blog...</p>
        </div>
    </section>

    <footer>
        <p>© 2026 MyBlog. All Rights Reserved.</p>
    </footer>

    <script>
        async function loadBlogDetails() {
            const container = document.getElementById('blog-details');
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                container.textContent = 'Blog ID not found.';
                return;
            }

            try {
                const response = await fetch(
                    `http://localhost:3000/api/blogs/${encodeURIComponent(id)}`
                );

                if (!response.ok) {
                    throw new Error('Blog not found');
                }

                const blog = await response.json();

                container.innerHTML = '';

                const card = document.createElement('div');
                card.className = 'blog-card';

                const title = document.createElement('h2');
                title.textContent = blog.title;

                const content = document.createElement('p');
                content.textContent = blog.content;

                const date = document.createElement('small');
                date.textContent = new Date(blog.created_at).toLocaleString();

                const back = document.createElement('a');
                back.href = 'index.html';
                back.textContent = 'Back to Home';

                card.append(title, content, date, document.createElement('br'), back);
                container.appendChild(card);

            } catch (error) {
                container.textContent = 'Unable to load blog details.';
                console.error(error);
            }
        }

        loadBlogDetails();
    </script>

</body>
</html>
